<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A股短线情报 AI Agent</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #fff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #edf0f4;
      --accent: #0f766e;
      --blue: #1d4ed8;
      --warn: #a15c07;
      --risk: #b42318;
      --good: #166534;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      padding: 14px clamp(14px, 3vw, 30px);
    }

    .topbar, main {
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 { margin: 0; font-size: clamp(20px, 2.5vw, 26px); line-height: 1.2; }
    .subtitle { margin: 5px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    .status-chip {
      border: 1px solid var(--line);
      background: #fbfcfd;
      min-width: 180px;
      padding: 8px 10px;
      text-align: right;
      font-size: 12px;
      color: var(--muted);
    }
    .status-chip strong { display: block; color: var(--accent); font-size: 15px; margin-top: 2px; }

    main { padding: 16px clamp(14px, 3vw, 30px) 28px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(16,24,40,.06);
    }
    .metric { padding: 12px; min-height: 74px; }
    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 7px; font-size: 19px; }
    .card { padding: 14px; margin-bottom: 12px; }
    .card-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    h2 { margin: 0; font-size: 16px; line-height: 1.35; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 5px; }
    .list-item { border-top: 1px solid var(--soft); padding-top: 11px; margin-top: 11px; }
    .list-item:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .item-head strong { font-size: 14px; line-height: 1.35; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 25px;
      border: 1px solid var(--line);
      background: #fbfcfd;
      color: #344054;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      line-height: 1.1;
    }
    .tag.good { background: #eefbf2; border-color: #bfe8ca; color: var(--good); }
    .tag.warn { background: #fff7e6; border-color: #f7d795; color: var(--warn); }
    .tag.risk { background: #fff1f2; border-color: #fac6cc; color: var(--risk); }
    .tag.blue { background: #eef4ff; border-color: #c7d7fe; color: var(--blue); }
    .note {
      background: #fff7e6;
      border: 1px solid #f7d795;
      color: #7a4300;
      padding: 10px;
      font-size: 12.5px;
      line-height: 1.6;
      margin-top: 10px;
    }
    .empty {
      border: 1px dashed var(--line);
      background: #fbfcfd;
      color: var(--muted);
      padding: 18px;
      text-align: center;
      font-size: 13px;
      line-height: 1.55;
    }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); }
    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12.5px;
      background: #fff;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
      line-height: 1.45;
      word-break: break-word;
    }
    th { background: #f6f8fa; color: #344054; font-weight: 700; }
    th:last-child, td:last-child { border-right: 0; }
    tr:last-child td { border-bottom: 0; }
    .score {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 26px;
      background: var(--accent);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (max-width: 760px) {
      .topbar { display: block; }
      .status-chip { width: 100%; text-align: left; margin-top: 10px; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      .summary-grid { grid-template-columns: 1fr; }
      .card, .metric { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>A股短线情报 AI Agent</h1>
        <p class="subtitle">每天 10:00 自动抓取财经快讯，生成 AI 主线判断、板块影响、候选观察池和逐条新闻分析。</p>
      </div>
      <div class="status-chip">
        <span id="statusText">正在读取日报</span>
        <strong id="reportTime">--</strong>
      </div>
    </div>
  </header>

  <main>
    <section class="summary-grid" id="summaryGrid"></section>
    <section id="report"><div class="empty">正在读取 daily-report.json...</div></section>
  </main>

  <script>
    const defaultHoldings = ["宁德时代 300750", "中际旭创 300308", "贵州茅台 600519"];
    const reportEl = document.getElementById("report");
    const summaryEl = document.getElementById("summaryGrid");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function getHoldings() {
      const saved = localStorage.getItem("ashare_agent_holdings");
      return (saved ? saved.split(/\n+/) : defaultHoldings).map(item => item.trim()).filter(Boolean);
    }

    function getImpacts(candidates) {
      const holdings = getHoldings();
      const impacts = [];
      holdings.forEach(holding => {
        candidates.forEach(stock => {
          if (holding.includes(stock.name) || holding.includes(stock.code)) {
            impacts.push({ holding, ...stock });
          }
        });
      });
      return impacts;
    }

    function renderSummary(payload, impacts) {
      const freshness = payload.freshness || {};
      summaryEl.innerHTML = `
        <div class="metric"><span>今日新闻</span><strong>${freshness.today_count ?? 0}</strong></div>
        <div class="metric"><span>命中板块</span><strong>${(payload.sectors || []).length}</strong></div>
        <div class="metric"><span>候选观察</span><strong>${(payload.candidates || []).length}</strong></div>
        <div class="metric"><span>AI 状态</span><strong>${payload.ai_enabled ? "已接入" : "规则模式"}</strong></div>
      `;
    }

    function renderAiCard(payload) {
      const aiFocus = payload.ai_focus || [];
      return `
        <div class="card">
          <div class="card-title">
            <h2>AI 总结</h2>
            <span class="tag ${payload.ai_enabled ? "good" : "warn"}">${payload.ai_enabled ? "AI 已接入" : "规则模式"}</span>
          </div>
          <div class="note">${escapeHtml(payload.ai_summary || payload.ai_error || "未配置 AI Key，当前展示规则分析。")}</div>
          ${payload.ai_market_view ? `<div class="meta">${escapeHtml(payload.ai_market_view)}</div>` : ""}
          ${aiFocus.map(item => `
            <div class="list-item">
              <div class="item-head"><strong>${escapeHtml(item.theme)}</strong><span class="tag blue">AI主线</span></div>
              <div class="meta">${escapeHtml(item.reason)}</div>
              <div class="tag-row">${(item.sectors || []).map(sector => `<span class="tag">${escapeHtml(sector)}</span>`).join("")}</div>
              <div class="meta"><strong>观察点：</strong>${escapeHtml(item.attention)}</div>
              <div class="meta"><strong>风险：</strong>${escapeHtml(item.risk)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderFreshness(payload) {
      const freshness = payload.freshness || {};
      const sources = freshness.sources || [];
      return `
        <div class="card">
          <div class="card-title">
            <h2>数据时效性</h2>
            <span class="tag ${freshness.is_fresh ? "good" : "warn"}">${freshness.is_fresh ? "已抓到今日新闻" : "新闻源可能滞后"}</span>
          </div>
          <div class="tag-row">
            <span class="tag blue">日报生成：${escapeHtml(payload.generated_label || "--")}</span>
            <span class="tag">最新新闻：${escapeHtml(freshness.latest_news_time || "--")}</span>
            <span class="tag">来源：${escapeHtml(freshness.latest_news_source || "--")}</span>
          </div>
          ${freshness.warning ? `<div class="note">${escapeHtml(freshness.warning)}</div>` : ""}
          <div class="tag-row">${sources.map(item => `<span class="tag">${escapeHtml(item.name)} ${item.items || 0}条</span>`).join("")}</div>
        </div>
      `;
    }

    function renderSectors(payload) {
      const sectors = payload.sectors || [];
      return `
        <div class="card">
          <div class="card-title"><h2>1. 新闻影响板块</h2><span class="tag">${escapeHtml(payload.version || "V3.1")}</span></div>
          ${sectors.length ? sectors.map(sector => `
            <div class="list-item">
              <div class="item-head"><strong>${escapeHtml(sector.name)}</strong><span class="score">${escapeHtml(sector.heat || "-")}</span></div>
              <div class="tag-row">
                <span class="tag ${sector.trend === "偏谨慎" || sector.trend === "分歧加大" ? "warn" : "good"}">${escapeHtml(sector.trend)}</span>
                ${(sector.hits || []).map(hit => `<span class="tag blue">${escapeHtml(hit)}</span>`).join("")}
              </div>
              <div class="meta">${escapeHtml(sector.short_view)}</div>
            </div>
          `).join("") : `<div class="empty">当前新闻暂未命中内置板块。</div>`}
        </div>
      `;
    }

    function renderCandidates(payload) {
      const rows = (payload.candidates || []).map(item => `
        <tr>
          <td><strong>${escapeHtml(item.name)}</strong><br><span class="meta">${escapeHtml(item.code)}</span></td>
          <td>${escapeHtml(item.sector)}<br><span class="tag blue">${escapeHtml(item.quality)}</span></td>
          <td>${escapeHtml(item.reason)}</td>
          <td>${escapeHtml(item.risk)}</td>
          <td><span class="score">${escapeHtml(item.score)}</span></td>
        </tr>
      `).join("");
      return `
        <div class="card">
          <div class="card-title"><h2>2. 候选观察池</h2><span class="tag risk">非买卖建议</span></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>股票</th><th>板块</th><th>入池逻辑</th><th>短线风险</th><th>分数</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="5">暂无候选观察股。</td></tr>`}</tbody>
            </table>
          </div>
          <div class="note">观察分只用于信息排序，不代表买入建议。短线仍需结合盘口、成交量、位置和个人风险承受能力。</div>
        </div>
      `;
    }

    function renderHoldingImpacts(impacts) {
      return `
        <div class="card">
          <div class="card-title"><h2>3. 持仓影响</h2><span class="tag">${impacts.length} 条命中</span></div>
          ${impacts.length ? impacts.map(item => `
            <div class="list-item">
              <div class="item-head"><strong>${escapeHtml(item.holding)}</strong><span class="tag warn">${escapeHtml(item.trend)}</span></div>
              <div class="meta">${escapeHtml(item.reason)}</div>
              <div class="tag-row"><span class="tag">${escapeHtml(item.sector)}</span><span class="tag risk">${escapeHtml(item.risk)}</span></div>
            </div>
          `).join("") : `<div class="empty">当前未命中默认持仓。真实持仓不要放到公开 GitHub 仓库。</div>`}
        </div>
      `;
    }

    function renderNewsAnalysis(payload) {
      const aiItems = payload.ai_news_analysis || [];
      const ruleItems = payload.news_analysis || [];
      const useAi = aiItems.length > 0;
      const items = useAi ? aiItems : ruleItems;
      return `
        <div class="card">
          <div class="card-title"><h2>4. 逐条新闻分析</h2><span class="tag blue">${items.length} 条</span></div>
          ${items.length ? items.slice(0, 12).map((item, index) => {
            if (useAi) {
              return `
                <div class="list-item">
                  <div class="item-head"><strong>${index + 1}. ${escapeHtml(item.title)}</strong><span class="tag blue">AI分析</span></div>
                  <div class="tag-row">
                    <span class="tag ${item.direction && item.direction.includes("负") ? "warn" : "good"}">${escapeHtml(item.direction)}</span>
                    ${(item.sectors || []).map(sector => `<span class="tag">${escapeHtml(sector)}</span>`).join("")}
                  </div>
                  <div class="meta"><strong>影响判断：</strong>${escapeHtml(item.impact)}</div>
                  <div class="meta"><strong>观察逻辑：</strong>${escapeHtml(item.watch_logic)}</div>
                  <div class="meta"><strong>风险提醒：</strong>${escapeHtml(item.risk)}</div>
                </div>
              `;
            }
            return `
              <div class="list-item">
                <div class="item-head"><strong>${index + 1}. <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></strong><span class="tag ${item.is_today ? "good" : "warn"}">${item.is_today ? "今日" : "非今日"}</span></div>
                <div class="meta">${escapeHtml(item.source)} · ${escapeHtml(item.published_label || item.published || "")}</div>
                ${item.summary ? `<div class="meta">${escapeHtml(item.summary)}</div>` : ""}
                ${(item.impacts || []).map(impact => `
                  <div class="note">
                    <div class="tag-row">
                      <span class="tag blue">${escapeHtml(impact.sector)}</span>
                      <span class="tag">${escapeHtml(impact.direction)}</span>
                      ${(impact.hits || []).map(hit => `<span class="tag">${escapeHtml(hit)}</span>`).join("")}
                    </div>
                    <div class="meta"><strong>影响逻辑：</strong>${escapeHtml(impact.logic)}</div>
                    ${(impact.watch_stocks || []).length ? `<div class="meta"><strong>观察股：</strong>${impact.watch_stocks.map(stock => `${escapeHtml(stock.name)} ${escapeHtml(stock.code)}`).join("、")}</div>` : ""}
                    <div class="meta"><strong>风险提醒：</strong>${escapeHtml(impact.risk)}</div>
                  </div>
                `).join("")}
              </div>
            `;
          }).join("") : `<div class="empty">暂无逐条新闻分析。</div>`}
        </div>
      `;
    }

    function renderRawNews(payload) {
      const news = payload.news || [];
      return `
        <div class="card">
          <div class="card-title"><h2>5. 原始新闻</h2><span class="tag blue">${news.length} 条</span></div>
          ${news.length ? news.slice(0, 15).map(item => `
            <div class="list-item">
              <div class="item-head"><strong><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></strong><span class="tag ${item.is_today ? "good" : "warn"}">${item.is_today ? "今日" : "非今日"}</span></div>
              <div class="meta">${escapeHtml(item.source)} · ${escapeHtml(item.published_label || item.published || "")}</div>
            </div>
          `).join("") : `<div class="empty">暂无新闻数据。</div>`}
        </div>
      `;
    }

    async function loadReport() {
      try {
        const response = await fetch(`daily-report.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error("daily-report.json not found");
        const payload = await response.json();
        const impacts = getImpacts(payload.candidates || []);
        renderSummary(payload, impacts);
        document.getElementById("statusText").textContent = "自动日报已更新";
        document.getElementById("reportTime").textContent = payload.generated_label || "--";
        reportEl.innerHTML = [
          renderFreshness(payload),
          renderAiCard(payload),
          renderSectors(payload),
          renderCandidates(payload),
          renderHoldingImpacts(impacts),
          renderNewsAnalysis(payload),
          renderRawNews(payload),
        ].join("");
      } catch (error) {
        summaryEl.innerHTML = "";
        reportEl.innerHTML = `<div class="empty">还没有读取到自动日报。请先运行 GitHub Actions 生成 daily-report.json。</div>`;
      }
    }

    loadReport();
  </script>
</body>
</html>
